name: CLI

on:
  push:
  pull_request:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout build submodules
        run: git submodule update --init external/ZArchive external/cmake-bin2h

      - name: Checkout vcpkg
        if: runner.os == 'Windows'
        run: git submodule update --init external/vcpkg

      - name: Read vcpkg commit
        if: runner.os == 'Windows'
        id: vcpkg-rev
        run: echo "rev=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      # vcpkg's x-gha cache backend was removed. Cache the file store instead.
      - name: Restore vcpkg cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ steps.vcpkg-rev.outputs.rev }}

      - name: Point vcpkg at the binary cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $cache = $cache.Replace('\', '/')
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      # The pinned vcpkg downloads msys2 pkgconf 2.2.0, which the mirrors no longer host.
      # A local pkg-config, kept in the port-build environment, makes vcpkg skip that download.
      - name: Install Windows pkg-config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          $roots = @($env:ChocolateyInstall, "$env:ProgramData\chocolatey") | Where-Object { $_ }
          $exe = $roots | ForEach-Object { Join-Path $_ "lib\pkgconfiglite" } |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter pkg-config.exe } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "pkg-config.exe was not installed" }
          # vcpkg wipes the port-build environment. Keep PKG_CONFIG or it still downloads the dead package.
          "PKG_CONFIG=$($exe.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "VCPKG_KEEP_ENV_VARS=PKG_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config liblz4-dev libzstd-dev libssl-dev libcurl4-openssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install pkg-config lz4 zstd openssl

      - name: Configure
        run: |
          args=(-S . -B build -DENABLE_GUI=OFF -DCMAKE_BUILD_TYPE=Release)
          if [ "$(uname -s)" = "Darwin" ]; then
            args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)")
          fi
          cmake "${args[@]}"

      - name: Save vcpkg cache
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ steps.vcpkg-rev.outputs.rev }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: |
          set -eu
          bin=
          while IFS= read -r candidate; do
            bin=$candidate
            break
          done < <(find build -type f \( -name XGDTool -o -name XGDTool.exe \) ! -path '*/CMakeFiles/*')
          if [ -z "${bin}" ]; then
            echo "XGDTool binary not found"
            find build -type f | head -100
            exit 1
          fi
          echo "Using ${bin}"
          "${bin}" --help
          "${bin}" --version
          mkdir -p build/dist
          case "${RUNNER_OS}" in
            Windows)
              cp "${bin}" build/dist/XGDTool.exe
              python3 .github/scripts/zip_release.py build/dist/XGDTool.exe build/dist/XGDTool-windows.zip
              rm -f build/dist/XGDTool.exe
              ;;
            macOS)
              mkdir -p build/dist/XGDTool-macos
              cp "${bin}" build/dist/XGDTool-macos/XGDTool
              python3 .github/scripts/bundle_macos_dylibs.py build/dist/XGDTool-macos/XGDTool
              build/dist/XGDTool-macos/XGDTool --version
              python3 .github/scripts/zip_release.py build/dist/XGDTool-macos build/dist/XGDTool-macos.zip
              rm -rf build/dist/XGDTool-macos
              ;;
            Linux)
              cp "${bin}" build/dist/XGDTool
              ;;
          esac

      # Built on Ubuntu 22.04 so the bundled libraries ride on glibc 2.35.
      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -eu
          sudo apt-get install -y patchelf python3-pil
          python3 - << 'PY'
          from PIL import Image
          image = Image.open("resources/app_icon.png").convert("RGBA")
          image = image.resize((256, 256), Image.Resampling.LANCZOS)
          image.save("/tmp/xgdtool-256.png")
          PY
          tools="$(mktemp -d)"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-appimage-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          export PATH="$tools:$PATH"
          linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/dist/XGDTool \
            --desktop-file resources/xgdtool.desktop \
            --icon-file /tmp/xgdtool-256.png \
            --output appimage
          appimage="$(echo XGDTool*.AppImage)"
          mv "$appimage" build/dist/XGDTool-x86_64.AppImage
          ./build/dist/XGDTool-x86_64.AppImage --version

      - name: Package deb
        if: runner.os == 'Linux'
        run: |
          set -eu
          chmod +x .github/scripts/build_deb.sh
          .github/scripts/build_deb.sh build/dist/XGDTool build/dist
          sudo apt-get install -y ./build/dist/xgdtool_*_amd64.deb
          XGDTool --version
          rm -f build/dist/XGDTool

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: XGDTool-${{ matrix.name }}
          path: build/dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: XGDTool-*
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        run: python3 .github/scripts/sha256sums.py artifacts SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error
